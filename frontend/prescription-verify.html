<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaSync - Prescription Verification</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="navbar" style="background:var(--success-green);">
  <div class="navbar-top">
    <a href="index.html" style="color:white;"><i class="ti ti-arrow-left" style="font-size:20px;"></i></a>
    <span style="font-weight:600;">Verify Prescription</span>
    <span></span>
  </div>
</div>

<div class="container mt-2">
  <div class="panel">
    <p class="section-title">Upload prescription</p>
    <form id="rx-upload-form" onsubmit="handlePrescriptionUpload(event)">
      <div class="form-group">
        <label>Prescription file (photo or PDF)</label>
        <input type="file" id="rx-file" class="form-control" accept="image/*,.pdf">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Upload for Verification</button>
    </form>
    <div id="rx-status"></div>
  </div>

  <div class="section-header">
    <p class="section-title" style="margin:0;">Verification history</p>
  </div>
  <div id="rx-history"></div>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/prescription-verify.js"></script>
</body>
</html>
