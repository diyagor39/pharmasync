<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaSync - Sign Up</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <i class="ti ti-vaccine"></i>
      <h1>Create account</h1>
    </div>

    <div class="role-select">
      <button type="button" class="active" onclick="selectRole('retailer', this)">Retailer</button>
      <button type="button" onclick="selectRole('distributor', this)">Distributor</button>
      <button type="button" onclick="selectRole('admin', this)">Admin</button>
    </div>

    <form id="signup-form" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signup-name" class="form-control" placeholder="Your name" required>
      </div>
      <div class="form-group">
        <label>Store / Company Name</label>
        <input type="text" id="signup-store" class="form-control" placeholder="e.g. Diya Medical Store">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="signup-email" class="form-control" placeholder="you@pharmacy.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
    </form>

    <p class="text-center text-muted mt-2" style="font-size:13px;">
      Already have an account? <a href="login.html" style="color:var(--primary-blue);font-weight:600;">Log in</a>
    </p>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
