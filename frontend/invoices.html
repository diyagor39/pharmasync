<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaSync - Invoices</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="section-header container">
  <p class="section-title" style="margin:0;">Invoices</p>
</div>

<div class="container">
  <table class="data-table" id="invoice-table">
    <thead>
      <tr><th>Order ID</th><th>Date</th><th>Amount</th><th>Status</th></tr>
    </thead>
    <tbody id="invoice-rows"></tbody>
  </table>
</div>

<div id="bottomnav-placeholder"></div>

<script>window.PAGE_CONFIG = { greeting: false, search: false, activeNav: "orders" };</script>
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/orders.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const rows = document.getElementById("invoice-rows");
    const orders = await getOrders();
    rows.innerHTML = orders.length ? orders.map(o => `
      <tr>
        <td>${o.id}</td>
        <td>${new Date(o.date).toLocaleDateString()}</td>
        <td>₹${o.total}</td>
        <td><span class="badge badge-info">${o.status}</span></td>
      </tr>
    `).join("") : `<tr><td colspan="4" class="text-center text-muted">No invoices yet</td></tr>`;
  });
</script>
</body>
</html>
