<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaSync - Voice Order</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="navbar">
  <div class="navbar-top">
    <a href="index.html" style="color:white;"><i class="ti ti-arrow-left" style="font-size:20px;"></i></a>
    <span style="font-weight:600;">Voice Order</span>
    <span></span>
  </div>
</div>

<div class="container text-center mt-3">
  <select id="voice-lang" class="form-control" style="max-width:220px;margin:0 auto 20px;">
    <option value="en-IN">English</option>
    <option value="hi-IN">Hindi</option>
    <option value="gu-IN">Gujarati</option>
  </select>

  <button id="voice-mic-btn" class="btn btn-primary" style="width:80px;height:80px;border-radius:50%;font-size:28px;">
    <i class="ti ti-microphone"></i>
  </button>
  <p id="voice-status" class="text-muted mt-2">Tap the mic to speak</p>
</div>

<div class="section-header container">
  <p class="section-title" style="margin:0;">Results</p>
</div>
<div class="card-grid" id="voice-results-grid"></div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/voice-order.js"></script>
</body>
</html>
