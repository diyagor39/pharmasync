<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaSync - Checkout</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div class="navbar">
  <div class="navbar-top">
    <a href="cart.html" style="color:white;"><i class="ti ti-arrow-left" style="font-size:20px;"></i></a>
    <span style="font-weight:600;">Checkout</span>
    <span></span>
  </div>
</div>

<div class="container mt-2">
  <div class="panel">
    <p class="section-title">Delivery details</p>
    <div class="form-group">
      <label>Store Address</label>
      <input type="text" id="checkout-address" class="form-control" placeholder="Shop no, street, city">
    </div>
    <div class="form-group">
      <label>Payment Method</label>
      <select id="checkout-payment" class="form-control">
        <option>Cash on Delivery</option>
        <option>UPI</option>
        <option>Credit (Net 30)</option>
      </select>
    </div>
  </div>

  <div class="panel flex-between">
    <span style="font-weight:600;">Order Total</span>
    <span id="checkout-total" style="font-weight:700;font-size:18px;color:var(--primary-blue);">₹0</span>
  </div>

  <button class="btn btn-primary btn-block" onclick="confirmCheckout()">Place Order</button>
</div>

<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/orders.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("checkout-total").textContent = "₹" + cartTotal();
  });

  function confirmCheckout() {
    const address = document.getElementById("checkout-address").value.trim();
    const payment = document.getElementById("checkout-payment").value;
    if (!address) {
      showToast("Please enter a delivery address", "error");
      return;
    }
    placeOrder({ address, paymentMethod: payment }).then(order => {
      if (order) {
        showToast("Order placed successfully!");
        setTimeout(() => (window.location.href = "orders.html"), 1000);
      }
    });
  }
</script>
</body>
</html>
