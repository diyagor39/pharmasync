<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PharmaSync - Distributor Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<div class="container mt-2">
  <div class="flex-between mb-2">
    <p class="section-title" style="margin:0;">Distributor Dashboard</p>
    <button class="btn btn-outline btn-sm" onclick="logout()">Log out</button>
  </div>

  <div class="stats-grid">
    <div class="stat-card"><p class="stat-label">Incoming Orders</p><p class="stat-value">18</p></div>
    <div class="stat-card"><p class="stat-label">Retailers Served</p><p class="stat-value">42</p></div>
    <div class="stat-card"><p class="stat-label">Redistribution Claims</p><p class="stat-value">5</p></div>
    <div class="stat-card"><p class="stat-label">Revenue (month)</p><p class="stat-value">₹1.2L</p></div>
  </div>

  <div class="panel">
    <p class="section-title">Near-expiry stock available to claim</p>
    <div id="redistribution-list"></div>
  </div>
</div>

<div id="bottomnav-placeholder"></div>

<script>window.PAGE_CONFIG = { greeting: true, search: false, activeNav: "profile" };</script>
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/products.js"></script>
<script src="js/redistribution.js"></script>
</body>
</html>
